<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>分区宇宙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02030a;
    touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }

  #loadingScreen{
    position:fixed;
    inset:0;
    background:#02030a;
    z-index:99;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition: opacity 0.8s ease;
  }
  #loadingScreen.fadeout{
    opacity:0;
    pointer-events:none;
  }
  .load-title{
    color:#ffe190;
    font-size:22px;
    letter-spacing:3px;
    margin-bottom:32px;
  }
  .progress-wrap{
    width:280px;
    height:6px;
    background:rgba(255,255,255,0.12);
    border-radius:99px;
    overflow:hidden;
  }
  #progressBar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ffe190,#ffc470);
    border-radius:99px;
    transition: width 0.08s linear;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .tip {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    color: rgba(255, 225, 140, 0.5);
    font-size: 13px;
    letter-spacing: 2px;
    pointer-events: none;
  }
  .area-toast {
    position: fixed;
    left: 50%;
    top: 86px;
    transform: translateX(-50%) translateY(-20px);
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    font-size: 14px;
    letter-spacing: 3px;
    backdrop-filter: blur(8px);
    opacity: 0;
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .area-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:20;}
  .modal.open{display:flex;}
  .panel{width:100%;max-width:420px;background:#0b0f1c;border-radius:18px;padding:20px;color:#fff;border:1px solid rgba(255,255,255,0.15);}
  #quoteModal .panel{
    background: radial-gradient(circle at center, #101428 0%, #02030a 100%);
    padding:28px 24px;
  }
  .quote-cn{font-size:18px;line-height:1.7;color:#ffe190;margin-bottom:16px;text-align:center;}
  .quote-en{font-size:14px;line-height:1.6;color:#cde0ff;text-align:center;}
  .quote-close{margin-top:20px;width:100%;padding:10px;border-radius:10px;border:none;font-size:14px;background:#5886ff;color:#fff;cursor:pointer;}

  #eventModal .panel{
    background: radial-gradient(circle at center, #101428 0%, #02030a 100%);
    max-width:440px;
  }
  #eventChoices button{
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:10px;
    border:none;
    background:#253b70;
    color:#fff;
    font-size:15px;
    cursor:pointer;
  }
  #eventChoices button:hover{
    background:#4068bb;
  }

  .msg-panel{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.88);
    padding:24px;
    border-radius:16px;
    z-index:30;
    width:82%;
    max-width:340px;
    color:#fff;
    display:none;
  }
  .msg-panel h3{
    margin-bottom:12px;
    font-weight:normal;
  }
  .msg-panel textarea{
    width:100%;
    height:110px;
    background:#1a1a1a;
    color:#fff;
    border:1px solid #555;
    border-radius:10px;
    padding:10px;
    font-size:16px;
  }
  .btn-group{
    display:flex;
    gap:12px;
    margin-top:14px;
  }
  .btn-group button{
    flex:1;
    padding:11px;
    border-radius:10px;
    border:none;
    font-size:16px;
  }
  .submit{background:#4285f4;color:white;}
  .close{background:#444;color:white;}
  .star-note{
    position:absolute;
    color:#ffffff;
    font-size:12px;
    pointer-events:none;
    white-space:nowrap;
    transform:translate(-50%, -180%);
  }
  .gold-panel{
    position:fixed;
    top:16px;
    left:16px;
    background:rgba(0,0,0,0.72);
    padding:12px 16px;
    border-radius:12px;
    color:#ffe190;
    font-size:16px;
    z-index:15;
    border:1px solid rgba(255,225,140,0.25);
  }
</style>
</head>

</div>

<div class="msg-panel" id="msgBox">

  <div class="btn-group">

</div>

const submitBtn = document.getElementById('submitBtn');
const closeBtn = document.getElementById('closeBtn');
const goldTextEl = document.getElementById("goldText");

const STORAGE_KEY = "starMessages";
let selectedStar = null;

let gold = 300;
let hasTriggeredGrandPrize = false;

function updateGoldUI(){
  goldTextEl.innerText = gold;
}

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
function loadSavedNotes(){
  const raw = localStorage.getItem(STORAGE_KEY);
  return raw ? JSON.parse(raw) : [];
}
function saveNotes(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
window.clearAllNotes = function(){
  localStorage.removeItem(STORAGE_KEY);
  if (typeof stars !== 'undefined') {
    stars.forEach(s=>{
      if(s.noteDom) s.noteDom.remove();
      s.noteText = "";
      s.noteDom = null;
    });
  }
}

closeBtn.onclick = ()=>{
  msgBox.style.display = 'none';
  msgInput.value = '';
  selectedStar = null;
}

submitBtn.onclick = ()=>{
  const txt = msgInput.value.trim();
  if(!txt || !selectedStar) return;

  let cost = 0;
  if(selectedStar.isBlueGiant){
    cost = 218;
  }else if(selectedStar.isSandGiant){
    cost = 5688;
  }else if(selectedStar.isRedGiant){
    cost = 22000;
  }else{
    cost = 28 + Math.floor(Math.random() * (140 - 28 + 1));
  }

  if(gold < cost){
    showAreaToast(`金币不足！需要${cost}金币`);
    return;
  }
  gold -= cost;
  updateGoldUI();

  const safeText = escapeHtml(txt);
  selectedStar.noteText = safeText;
  selectedStar.noteDom = document.createElement('div');
  selectedStar.noteDom.className = 'star-note';
  selectedStar.noteDom.innerText = safeText;
  document.body.appendChild(selectedStar.noteDom);

  const saved = loadSavedNotes();
  saved.push({
    starId: selectedStar.id,
    text: txt
  });
  saveNotes(saved);

  msgBox.style.display = 'none';
  msgInput.value = '';
  selectedStar = null;
  showAreaToast(`留言成功，消耗${cost}金币`);
}

quoteCloseBtn.onclick = () => {
  quoteModal.classList.remove('open');
  msgBox.style.display = "block";
};

const gameState = {
  hideBoost: false,
  scanActive: false,
  dustStorm: false,
  signalLeak: false,
  ancientFragments: 0,
  techLevel: 0,
  stayTimer: 0,
  lastEventArea: -1,
  eventCooldown: 0
};

const eventModal = document.getElementById('eventModal');
const eventTitle = document.getElementById('eventTitle');
const eventDesc = document.getElementById('eventDesc');
const eventChoices = document.getElementById('eventChoices');

function triggerCosmicEvent(evt){
  eventTitle.innerText = evt.cn;
  eventDesc.innerText = evt.desc;
  eventChoices.innerHTML = "";
  evt.choices.forEach(ch=>{
    const btn = document.createElement("button");
    btn.innerText = ch.text;
    btn.onclick = ()=>{
      applyEffect(ch.effect);
      eventModal.classList.remove("open");
      gameState.eventCooldown = 8000;
    }
    eventChoices.appendChild(btn);
  })
  eventModal.classList.add("open");
}

function applyEffect(eff){
  if(eff.hide !== undefined) gameState.hideBoost = eff.hide;
  if(eff.scan !== undefined) gameState.scanActive = eff.scan;
  if(eff.dustStorm !== undefined) gameState.dustStorm = eff.dustStorm;
  if(eff.leakSignal) gameState.signalLeak = true;
  if(eff.ancientInfo) gameState.ancientFragments += 1;
  if(eff.techGain) gameState.techLevel += eff.techGain;
  if(eff.expand){
    stars.forEach(s=>{
      s.flow.x *=1.1;
      s.flow.y *=1.1;
      s.flow.z *=1.1;
    })
  }
  if(eff.research){
    stars.forEach(s=> s.twinkleSpeed *=0.85);
  }

  const rnd = Math.random() * 100;
  let goldDelta;
  if(rnd < 3){
    goldDelta = 10000;
    hasTriggeredGrandPrize = true;
    showAreaToast(`🎉大奖！获得10000金币！`);
  }else if(rnd < 4 && hasTriggeredGrandPrize){
    goldDelta = -7000;
    showAreaToast(`⚠️灾难！损失7000金币！`);
  }else{
    goldDelta = Math.floor(Math.random() * (90 + 70 + 1)) - 70;
  }
  gold += goldDelta;
  if(gold < 0) gold = 0;
  updateGoldUI();
  if(rnd >= 4) showAreaToast(`事件已生效，金币变动 ${goldDelta}`);
}

function updateCosmicEvents(dt, areaId){
  if(gameState.eventCooldown > 0){
    gameState.eventCooldown -= dt;
    return;
  }
  if(gameState.lastEventArea !== areaId){
    gameState.stayTimer = 0;
    gameState.lastEventArea = areaId;
  }
  gameState.stayTimer += dt;

  if(gameState.stayTimer > 8000 && Math.random() < 0.0008){
    const randomEvt = COSMIC_EVENTS[Math.floor(Math.random() * COSMIC_EVENTS.length)];
    triggerCosmicEvent(randomEvt);
    gameState.stayTimer = 0;
  }
}

  const asteroids = [];

      x: Math.cos(ang)*ringR,

    })

  const sun = {

  };

  const meteors = [];
  const METEOR_SPAWN_INTERVAL = 1200;

  function spawnMeteor(){
    const angle = Math.random() * Math.PI*0.6 + Math.PI*0.2;
    const speed = 4 + Math.random()*6;
    const length = 60 + Math.random()*120;
    meteors.push({
      x: Math.random()*W,
      y: Math.random()*H*0.4,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      len:length,
      alpha:1,
      life:1
    })
  }

  function drawMeteor(met){
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(met.x, met.y);
    ctx.lineTo(met.x - met.vx*met.len/10, met.y - met.vy*met.len/10);
    const grad = ctx.createLinearGradient(
      met.x,met.y,
      met.x - met.vx*met.len/10, met.y - met.vy*met.len/10
    );
    grad.addColorStop(0,`rgba(255,255,255,${met.alpha})`);
    grad.addColorStop(1,`rgba(255,255,255,0)`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();
  }

  function updateMeteors(dt){
    meteorTimer += dt;
    if(meteorTimer > METEOR_SPAWN_INTERVAL){
      spawnMeteor();
      meteorTimer = 0;
    }
    for(let i=meteors.length-1;i>=0;i--){
      const m = meteors[i];
      m.x += m.vx;
      m.y += m.vy;
      m.life -= 0.016;
      m.alpha = Math.max(0, m.life);
      if(m.life <=0 || m.x>W+100 || m.y>H+100){
        meteors.splice(i,1);
      }
    }
  }

  const STAR_COUNT = 2400;
  for (let i = 0; i < STAR_COUNT; i++) {
    const area = AREAS[Math.floor(Math.random() * AREAS.length)];
    const r = area.minDist + Math.random() * (area.maxDist - area.minDist);

    const phi = Math.acos(2 * Math.random() - 1);

    const y = r * Math.sin(phi) * Math.sin(theta);
    const z = r * Math.cos(phi);

    stars.push({
      id: starIdCounter++,
      x, y, z,
      areaId: area.id,
      baseR: 0.18 + Math.random() * 0.42,
      color: area.color,

      twinklePhase: Math.random() * Math.PI * 2,
      flow: { x: 0.04, y: 0.016, z: 0.008 },
      noteText:"",
      noteDom:null,
      proj:null,
      isBlueGiant:false,
      isSandGiant:false,
      isRedGiant:false
    });
  }

  const PLANET_COUNT = 26;
  const planetColors = [
    [220, 120, 80], [80, 140, 200], [160, 90, 120], [100, 170, 130],
    [190, 100, 70], [130, 120, 180], [200, 170, 90], [150, 90, 70],
    [90, 130, 170], [110, 150, 110], [170, 110, 130], [140, 140, 180],
    [230, 150, 90], [180, 130, 110], [100, 120, 160], [120, 180, 150],
    [210, 140, 160], [160, 100, 150], [240, 200, 120], [170, 90, 60],
    [80, 110, 150], [130, 170, 140], [190, 120, 100], [150, 150, 190],
    [220, 180, 140], [140, 100, 120]
  ];

  for (let i = 0; i < PLANET_COUNT; i++) {
    const area = AREAS[i % AREAS.length];
    const r = area.minDist + Math.random() * Math.min(600, area.maxDist - area.minDist);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = r * Math.sin(phi) * Math.sin(theta);
    const z = r * Math.cos(phi);

    planets.push({
      x, y, z,
      areaId: area.id,
      radius: 22 + Math.random() * 40,
      color: planetColors[i % planetColors.length],
      vx: (Math.random() - 0.5) * 0.008,
      vy: (Math.random() - 0.5) * 0.008,
      vz: (Math.random() - 0.5) * 0.008
    });
  }

  let touching = false;
  let lastX = 0;
  let lastY = 0;
  let pinchStartDist = 0;
  let pinchStartCam = 1400;
  const ROTATE_SENS = 0.005 * 0.4;

  canvas.addEventListener("touchstart", e => {
    touching = true;
    if (e.touches.length === 1) {
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      pinchStartDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      pinchStartCam = targetCamDist;
    }
  }, { passive: false });

  canvas.addEventListener("touchmove", e => {
    if (!touching) return;
    e.preventDefault();
    if (e.touches.length === 1) {
      const x = e.touches[0].clientX;
      const y = e.touches[0].clientY;
      targetRotY += (x - lastX) * ROTATE_SENS;
      targetRotX += (y - lastY) * ROTATE_SENS;
      lastX = x;
      lastY = y;
    } else if (e.touches.length === 2) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const raw = pinchStartCam * (pinchStartDist / dist);
      const delta = raw - pinchStartCam;
      targetCamDist = pinchStartCam + delta * 0.4;
      targetCamDist = Math.max(AREAS[0].minDist, Math.min(AREAS[AREAS.length - 1].maxDist, targetCamDist));
    }
  }, { passive: false });

  canvas.addEventListener("touchend", () => touching = false);

  canvas.onclick = (evt) => {
    const mx = evt.clientX;
    const my = evt.clientY;
    let hitStar = null;
    let minD = 9999;
    for(const s of stars){
      if(!s.proj) continue;
      const d = Math.hypot(mx - s.proj.sx, my - s.proj.sy);
      if(d < 12 && d < minD){
        minD = d;
        hitStar = s;
      }
    }
    for(const bp of bigPlanets){
      const p = project(bp.x,bp.y,bp.z);
      if(!p) continue;
      const screenR = bp.radius * p.scale;
      const d = Math.hypot(mx - p.sx, my - p.sy);
      if(d < screenR && d < minD){
        minD = d;
        hitStar = bp;
      }

      quoteEN.innerText = randQuote.en;
      quoteModal.classList.add("open");
    }
  }

  function project(px, py, pz) {
    let x = px * Math.cos(rotY) - pz * Math.sin(rotY);
    let z = px * Math.sin(rotY) + pz * Math.cos(rotY);
    let y = py;

    let y2 = y * Math.cos(rotX) - z * Math.sin(rotX);
    let z2 = y * Math.sin(rotX) + z * Math.cos(rotX);
    y = y2;
    z = z2 + camDist;

    if (z <= 30) return null;

    const scale = FOV / z;
    return {
      sx: W / 2 + x * scale,
      sy: H / 2 + y * scale,
      scale,
      z
    };
  }

  function drawPlanet(p, planet) {
    const s = p.scale;
    const r = planet.radius * s;

    const glow = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, r * 2.4);
    glow.addColorStop(0, `rgba(${planet.color[0]},${planet.color[1]},${planet.color[2]},0.55)`);
    glow.addColorStop(1, `rgba(${planet.color[0]},${planet.color[1]},${planet.color[2]},0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(p.sx, p.sy, r * 2.4, 0, Math.PI * 2);
    ctx.fill();

    const body = ctx.createRadialGradient(
      p.sx - r * 0.35, p.sy - r * 0.35, r * 0.1,
      p.sx, p.sy, r
    );
    body.addColorStop(0, `rgb(${Math.min(255, planet.color[0] + 40)},${Math.min(255, planet.color[1] + 40)},${Math.min(255, planet.color[2] + 40)})`);
    body.addColorStop(1, `rgb(${planet.color[0]},${planet.color[1]},${planet.color[2]})`);
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBigPlanet(p, planet){
    const s = p.scale;
    const r = planet.radius * s;
    const glow = ctx.createRadialGradient(p.sx, p.sy,0,p.sx,p.sy,r*2.2);
    if(planet.type === "sand"){
      glow.addColorStop(0,"rgba(210,165,90,0.5)");
      glow.addColorStop(1,"rgba(210,165,90,0)");
    }else if(planet.type === "redgiant"){
      glow.addColorStop(0,"rgba(220,40,40,0.65)");
      glow.addColorStop(1,"rgba(220,40,40,0)");
    }else{
      glow.addColorStop(0,"rgba(80,130,200,0.5)");
      glow.addColorStop(1,"rgba(80,130,200,0)");
    }
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(p.sx,p.sy,r*2.2,0,Math.PI*2);
    ctx.fill();

    const bodyGrad = ctx.createRadialGradient(p.sx-r*0.3,p.sy-r*0.3, r*0.1, p.sx,p.sy,r);
    if(planet.type === "sand"){
      bodyGrad.addColorStop(0,"#e6c288");

    }else if(planet.type === "redgiant"){
      bodyGrad.addColorStop(0,"#ff6b6b");
      bodyGrad.addColorStop(1,"#7a1414");

      bodyGrad.addColorStop(0,"#77aadd");
      bodyGrad.addColorStop(1,"#335588");

  function drawAsteroid(p,ast){
    const s = p.scale;
    const r = ast.r * s;
    ctx.fillStyle=`rgb(${ast.color[0]},${ast.color[1]},${ast.color[2]})`;
    ctx.beginPath();
    ctx.arc(p.sx,p.sy,r,0,Math.PI*2);
    ctx.fill();
  }

  function drawSun(p){
    const s = p.scale;
    const r = sun.radius * s;
    const flare = ctx.createRadialGradient(p.sx,p.sy,0,p.sx,p.sy,r*3.5);
    flare.addColorStop(0,"rgba(255,255,255,1)");
    flare.addColorStop(0.2,"rgba(255,255,200,0.6)");
    flare.addColorStop(1,"rgba(255,255,200,0)");
    ctx.fillStyle=flare;
    ctx.beginPath();
    ctx.arc(p.sx,p.sy,r*3.5,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#ffffff";
    ctx.beginPath();
    ctx.arc(p.sx,p.sy,r,0,Math.PI*2);

  function drawStar(s, time) {
    let brightnessMult = 1;
    if(gameState.dustStorm) brightnessMult = 0.45;
    if(gameState.hideBoost) brightnessMult *=0.7;

    const p = project(s.x, s.y, s.z);
    if (!p) return;
    s.proj = p;

    const tw = brightnessMult * (0.75 + 0.25 * Math.sin(time * s.twinkleSpeed + s.twinklePhase));
    const r = Math.max(0.12, s.baseR * p.scale * 70 * tw);
    const [cr, cg, cb] = s.color;

    const glow = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, r * 2.2);
    glow.addColorStop(0, `rgba(${cr},${cg},${cb},${0.18 * tw})`);
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(p.sx, p.sy, r * 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
    ctx.beginPath();
    ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
    ctx.fill();

    if(s.noteDom){
      s.noteDom.style.left = p.sx + "px";
      s.noteDom.style.top = p.sy + "px";
    }
  }

  function updateStar(s) {
    s.x += s.flow.x;
    s.y += s.flow.y;
    s.z += s.flow.z;

    const l = Math.hypot(s.x, s.y, s.z);
    if (l > 22000) {
      s.x *= 0.82;
      s.y *= 0.82;
      s.z *= 0.82;
    }
  }

  function updatePlanet(pl) {
    pl.x += pl.vx;
    pl.y += pl.vy;
    pl.z += pl.vz;

    const len = Math.hypot(pl.x, pl.y, pl.z);
    if(len > 22000){
      pl.x *=0.78;
      pl.y *=0.78;
      pl.z *=0.78;
    }
  }

  let lastTime = 0;
  let loadProgress = 0;
  const totalLoadTime = 1800;

  function animate(time) {
    requestAnimationFrame(animate);
    const dt = time - lastTime;
    lastTime = time;

    if(loadProgress < 1){
      loadProgress += dt / totalLoadTime;
      progressBar.style.width = (loadProgress*100)+"%";
      if(loadProgress >= 1){
        loadingScreen.classList.add("fadeout");
      }
    }

    rotX += (targetRotX - rotX)*0.08;
    rotY += (targetRotY - rotY)*0.08;
    camDist += (targetCamDist - camDist)*0.08;

    const areaInfo = getAreaByDist(camDist);
    if(currentAreaId !== areaInfo.id){
      currentAreaId = areaInfo.id;
      showAreaToast(`您已进入 ${areaInfo.name}`);
    }
    updateCosmicEvents(dt, currentAreaId);

    ctx.fillStyle="#02030a";
    ctx.fillRect(0,0,W,H);

    updateMeteors(dt);
    meteors.forEach(m=>drawMeteor(m));

    stars.forEach(s=>{
      updateStar(s);
      drawStar(s, time);
    })

    asteroids.forEach(ast=>{
      const p = project(ast.x,ast.y,ast.z);
      if(p) drawAsteroid(p,ast);
    })

    planets.forEach(pl=>{
      updatePlanet(pl);
      const p = project(pl.x,pl.y,pl.z);
      if(p) drawPlanet(p,pl);
    })

    bigPlanets.forEach(bp=>{
      bp.rot += 0.0012;
      const p = project(bp.x,bp.y,bp.z);
      if(p) drawBigPlanet(p,bp);
    })

    const sunProj = project(sun.x,sun.y,sun.z);
    if(sunProj) drawSun(sunProj);
  }

  function restoreNotes(){
    const savedList = loadSavedNotes();
    savedList.forEach(item=>{
      const star = stars.find(s=>s.id === item.starId);
      if(!star) return;
      star.noteText = escapeHtml(item.text);
      star.noteDom = document.createElement('div');
      star.noteDom.className = "star-note";
      star.noteDom.innerText = star.noteText;
      document.body.appendChild(star.noteDom);
    })
  }
  restoreNotes();

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
